name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.9 is gone from GitHub's own Python builds, so uv fetches it
      matrix: {python: ["3.9", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} --with-editable . python -m unittest discover -s tests -v
