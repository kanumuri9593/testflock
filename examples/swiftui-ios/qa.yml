# A SwiftUI app on the iOS Simulator (macOS only: a self-hosted runner or
# your own Mac). Build first, e.g.:
#   xcodebuild -scheme MyApp -sdk iphonesimulator -configuration Debug -derivedDataPath build
name: MyApp (SwiftUI)
app:
  ios:
    app: build/Build/Products/Debug-iphonesimulator/MyApp.app
matrix:
  platforms: [ios]
  devices: {ios: [iphone-17, iphone-16-pro-max, iphone-se]}
  locales: [en-US]
  themes: [light, dark]
  text_sizes: [default, largest]
tests:
  - name: Home screen opens
    steps:
      - wait: 3
      - screenshot: home
      - scroll: {until: "/Settings|More/", max: 8, optional: true}
  - name: First visit
    agent:
      persona: "Curious first-time user with five spare minutes"
      goal: "Find the main feature and use it once."
      max_actions: 25
checks: [a11y, crash]
ai: {provider: claude-code, model: sonnet}
